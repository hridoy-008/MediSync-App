name: medisync
description: "MediSync — snap a prescription, get reliable offline reminders and a personalized care plan. Bilingual Bangla/English."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  get: ^4.6.6

  # Local persistence (reminder mirror + prefs) — Firebase-independent
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Notifications & exact alarms (offline reminder engine)
  flutter_local_notifications: ^17.2.1
  android_alarm_manager_plus: ^4.0.4
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1

  # Permissions
  permission_handler: ^11.3.1

  # Prescription capture
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # On-device OCR (English/Latin fast path)
  google_mlkit_text_recognition: ^0.13.1

  # Firebase (behind repository interfaces)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3

  # i18n
  intl: ^0.20.2

  # Charts (BMI gauge / adherence — P1-ready)
  fl_chart: ^0.69.0

  # Voice & Reports
  flutter_tts: ^4.2.2
  pdf: ^3.11.1
  printing: ^5.13.2

  # Utils
  uuid: ^4.5.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    # Variable fonts — a single file covers all weights via the wght axis.
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
